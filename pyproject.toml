[tool.pytest.ini_options]
pythonpath = [
    ".",
    "packages/contracts/python",
    "services/api",
    "services/outbox-publisher",
    "services/execution-controller",
    "services/result-collector",
]
testpaths = [
    "packages/contracts/python/tests",
    "services/api/tests",
    "tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (FastAPI Depends/Header pattern)
]
