apiVersion: v1
kind: Namespace
metadata:
  name: forge-runner
  labels:
    app.kubernetes.io/name: forgerun
    app.kubernetes.io/component: sandbox-workloads
    # Enforce Kubernetes Restricted Pod Security Standards
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: runner-resource-quota
  namespace: forge-runner
spec:
  hard:
    pods: "100"
    requests.cpu: "50"
    requests.memory: "100Gi"
    limits.cpu: "100"
    limits.memory: "200Gi"
    requests.ephemeral-storage: "50Gi"
    limits.ephemeral-storage: "100Gi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: runner-limit-range
  namespace: forge-runner
spec:
  limits:
    - default:
        cpu: "1000m"
        memory: "512Mi"
        ephemeral-storage: "500Mi"
      defaultRequest:
        cpu: "250m"
        memory: "128Mi"
        ephemeral-storage: "100Mi"
      max:
        cpu: "2000m"
        memory: "2Gi"
        ephemeral-storage: "2Gi"
      min:
        cpu: "50m"
        memory: "32Mi"
      type: Container
