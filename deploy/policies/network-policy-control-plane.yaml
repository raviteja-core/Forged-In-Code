apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-plane-internal-policy
  namespace: forge-control
  labels:
    app.kubernetes.io/name: forgerun
    app.kubernetes.io/component: control-plane-network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: forgerun-control
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from ingress-controller to API
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
    # Allow Prometheus scraping
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forge-observability
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # Allow connection to PostgreSQL, Kafka, and Redis in forge-data
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forge-data
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 6379
    # Allow DNS queries within cluster
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow execution controller to communicate with Kubernetes API server
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
