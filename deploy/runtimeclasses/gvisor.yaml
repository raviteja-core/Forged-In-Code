apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
  labels:
    app.kubernetes.io/name: forgerun
    app.kubernetes.io/component: sandbox-runtime
handler: runsc
overhead:
  podFixed:
    cpu: "50m"
    memory: "32Mi"
scheduling:
  nodeSelector:
    sandbox.forgerun.io/gvisor-enabled: "true"
  tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "runner"
      effect: "NoSchedule"
